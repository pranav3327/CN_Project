# Team DNS server for @DOMAIN@ – installed as /etc/dnsmasq.d/cn-team.conf by `make converge`
# Same file on the primary (node-1) and the backup (node-3); only SELF_IP differs.

# Listen on this machine's private LAN interface/IP only (never 127.0.0.1, or the
# other machines could not use this server). Ubuntu's own resolver keeps
# 127.0.0.53:53, so bind-interfaces stops the two fighting over port 53.
interface=@IFACE@
listen-address=@SELF_IP@
bind-interfaces

# Don't read /etc/resolv.conf or /etc/hosts. Anything that is not ours
# (apt, docker images, ...) is forwarded to the AWS VPC resolver.
no-resolv
no-hosts
server=169.254.169.253
domain-needed
bogus-priv

# Our private zone: answered here, never forwarded. Unknown names -> NXDOMAIN.
local=/@DOMAIN@/

# TTL of the records below (Extension B: short, clearly visible TTL)
local-ttl=@TTL@

# Service names -> the edge (node-2). `cn-dns set <ip>` changes these two lines.
address=/app.@DOMAIN@/@APP_IP@
address=/api.@DOMAIN@/@APP_IP@

# Infrastructure names (handy for dig and the inventory)
address=/node-1.@DOMAIN@/@NODE1_IP@
address=/node-2.@DOMAIN@/@NODE2_IP@
address=/node-3.@DOMAIN@/@NODE3_IP@
address=/node-4.@DOMAIN@/@NODE4_IP@

# Log every query – shown live in the tmux "logs" window.
log-queries
