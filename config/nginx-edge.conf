# /etc/nginx/conf.d/cn-edge.conf – the edge: reverse proxy + load balancer + TLS.
# Installed on node-2 (edge) and node-3 (standby edge) by `make converge`.

# hh:mm:ss for the log (nginx has no short time variable)
map $time_iso8601 $cn_time {
    ~T(?<hms>[0-9:]+) $hms;
    default           $time_iso8601;
}

# One line per request: client socket, TLS version, which backend answered.
log_format cn_edge '$cn_time $remote_addr:$remote_port "$request" $status '
                   'tls=$ssl_protocol upstream=$upstream_addr up_status=$upstream_status '
                   'backend=$upstream_http_x_backend rt=${request_time}s';

upstream backends {
    zone backends 64k;      # round-robin + health state shared by all workers
    # Round-robin (default). Passive health check (Extension D):
    # one failed attempt marks a backend down for 10 s, then nginx tries it again.
    server @NODE3_IP@:3001 max_fails=1 fail_timeout=10s;   # Backend A (node-3)
    server @NODE4_IP@:3002 max_fails=1 fail_timeout=10s;   # Backend B (node-4)
}

# Plain HTTP only redirects to HTTPS
server {
    listen 80;
    server_name app.@DOMAIN@ api.@DOMAIN@;
    access_log /var/log/nginx/cn-edge.log cn_edge;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;                          # HTTP/2 via ALPN; HTTP/1.1 still works
    server_name app.@DOMAIN@ api.@DOMAIN@;

    ssl_certificate     /etc/nginx/cn-tls/tls.crt; # TLS terminates here
    ssl_certificate_key /etc/nginx/cn-tls/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/cn-edge.log cn_edge;
    error_log  /var/log/nginx/cn-edge-error.log notice;

    add_header X-Edge $hostname always;            # which edge machine answered

    location / {
        proxy_pass http://backends;                # plain HTTP inside the private LAN
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503;   # retry on the other backend
    }
}
